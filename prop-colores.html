<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><style>body{background:#0f172a;color:#fff;font-family:Arial;padding:20px;text-align:center}.op{display:inline-block;margin:15px;vertical-align:top;background:#1e293b;padding:15px;border-radius:12px}img{width:160px;height:160px;object-fit:contain}</style></head><body>
<h1>🎨 Propuestas de recolor del logo</h1>
<div class="op"><h3>A — Azul profundo</h3><img src="logo.webp" style="filter:hue-rotate(200deg) saturate(1.5)"></div>
<div class="op"><h3>B — Verde esmeralda</h3><img src="logo.webp" style="filter:hue-rotate(90deg) saturate(1.4)"></div>
<div class="op"><h3>C — Azul-verde degradado</h3><img src="logo.webp" style="filter:hue-rotate(160deg) saturate(1.8) contrast(1.1)"></div>
</body></html>
